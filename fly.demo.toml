# Public read-only judge demo: the three-day replay over recorded Ring days, live Qwen3-VL on Bedrock when its key is set.
# porch-pickup-kb (fly.toml) stays the Ring endpoint host behind operator sign-in.
app = "seen-off-demo"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"

[processes]
  app = "node scripts/replay-serve.ts --public --pace-ms 1200"

[http_service]
  internal_port = 8080
  force_https = true
  processes = ["app"]
  # The demo ledger lives in memory, so the machine stays up.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
